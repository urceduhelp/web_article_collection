<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ලිපි ගබඩාව</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2a26;--mute:#667570;--line:#d9dfdb;--acc:#1f6f5c;--acc2:#e4f0ec;--danger:#b3372f}
@media (prefers-color-scheme:dark){:root{--bg:#141b19;--card:#1c2623;--ink:#e6eeeb;--mute:#93a39d;--line:#2d3a36;--acc:#5fc2a8;--acc2:#21352f;--danger:#ff8f86}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 12px}
h2{font-size:1.15rem;margin:0 0 4px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.d{color:var(--danger)}
:is(button,input,textarea):focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{resize:vertical}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;padding:10px 18px;color:var(--mute);margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.big{font-size:1.05rem;padding:12px 14px;margin-bottom:6px}
.meta{color:var(--mute);font-size:.9rem;margin-bottom:14px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.item h3{margin:0 0 2px;font-size:1.1rem}
.sub{color:var(--mute);font-size:.88rem;word-break:break-all}
.sub a{color:var(--acc)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:0 10px;font-size:.8rem;margin:6px 6px 0 0;cursor:pointer}
.body{white-space:pre-wrap;margin-top:10px;max-height:5.2em;overflow:hidden}
.item.open .body{max-height:none}
.note{margin-top:8px;padding:8px 10px;background:var(--acc2);border-radius:8px;font-size:.92rem;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{padding:4px 12px;font-size:.88rem}
mark{background:#ffe27a;color:#000;border-radius:3px;padding:0 1px}
label{display:block;margin:10px 0 3px;font-size:.9rem;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px}
.foot{display:flex;gap:8px;margin-top:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.empty{text-align:center;color:var(--mute);padding:36px 0}
.err{color:var(--danger);margin-top:10px;font-size:.92rem;white-space:pre-wrap}
select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.fp,.sr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.srh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.srh .acts{margin:0}
.pkb{margin-top:8px}
.pkt{white-space:pre-wrap;max-height:200px;overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px;user-select:text;-webkit-user-select:text}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}
.chk label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)}
.chk input{width:auto}
.pick{display:inline-flex;align-items:center;gap:5px;font-size:.88rem;cursor:pointer;margin:0;color:var(--ink)}
.pick input{width:auto}
#bk{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.bkbar{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;align-items:center}
#bkf{flex:1;border:0;width:100%;background:#777}
[hidden]{display:none!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ලිපි ගබඩාව</h1>
  <div class="tabs">
    <button id="t-search" class="on">🔍 සොයන්න</button>
    <button id="t-admin">🔐 Admin</button>
  </div>

  <section id="s-search">
    <input id="q" class="big" type="search" placeholder="සොයන්න: මාතෘකාව, කතුවරයා, ටැග්, ලිපියේ වචන…">
    <div class="meta" id="meta"></div>
    <div id="list"></div>
  </section>

  <section id="s-admin" hidden>
    <div id="login" class="box" style="max-width:420px">
      <h2>Admin ප්‍රවේශය</h2>
      <form id="lf">
        <label>Email</label><input id="em" type="email" autocomplete="username" required>
        <label>මුරපදය</label><input id="pw" type="password" autocomplete="current-password" required>
        <div class="foot"><button class="p" type="submit">ඇතුල් වන්න</button></div>
        <div class="err" id="lerr"></div>
      </form>
    </div>

    <div id="panel" hidden>
      <div class="bar"><span id="who" class="sub"></span><button id="out">ඉවත් වන්න</button></div>
      <form id="f" class="box">
        <h2 id="ft">නව ලිපියක් ඇතුළත් කරන්න</h2>
        <label>ලිපියේ මාතෘකාව</label><input id="title">
        <div class="row">
          <div><label>Web link එක</label><input id="url" placeholder="https://…"></div>
          <div><label>ලේඛකයාගේ නම</label><input id="author"></div>
        </div>
        <label>ටැග් (කොමාවෙන් වෙන් කරන්න)</label><input id="tags">
        <label>ලිපිය (Text)</label><textarea id="content" rows="10"></textarea>
        <label>මගේ සටහන්</label><textarea id="notes" rows="2"></textarea>
        <div class="foot"><button class="p" type="submit" id="save">සුරකින්න</button><button type="button" id="cancel" hidden>වෙනස් කිරීම නවතන්න</button></div>
        <div class="err" id="ferr"></div>
      </form>
      <div class="box" id="bkbox">
        <h2>📚 ලිපි තෝරා පොතක් (PDF) සකසන්න</h2>
        <div class="meta">පහත "සුරැකි ලිපි" අතර ලිපිවල <b>📖 පොතට</b> ටික් කර ලිපි තෝරන්න.</div>
        <div class="row">
          <div><label>පොතේ නම</label><input id="bt"></div>
          <div><label>උප මාතෘකාව / සම්පාදකයා (අවශ්‍ය නම්)</label><input id="bs"></div>
        </div>
        <h2 style="margin-top:16px">මුල් පිටු (පිදුම, හැඳින්වීම ආදිය)</h2>
        <div id="bfront"></div>
        <div class="foot"><button type="button" id="addfront">+ මුල් පිටුවක් එක් කරන්න</button></div>
        <div class="chk">
          <label><input type="checkbox" id="btoc" checked> පටුන ඇතුළත් කරන්න</label>
          <label><input type="checkbox" id="bidx" checked> සුචිය (Index) ඇතුළත් කරන්න</label>
          <label><input type="checkbox" id="bnotes"> මගේ සටහන් ඇතුළත් කරන්න</label>
        </div>
        <h2 id="bcnt">0 ලිපි තෝරා ඇත</h2>
        <div id="bsel"></div>
        <div class="foot"><button class="p" type="button" id="mkbook">📖 පොත සකසන්න</button></div>
        <div class="err" id="bkerr"></div>
      </div>
      <h2>සුරැකි ලිපි</h2>
      <input id="aq" class="big" type="search" placeholder="ලිපි අතර පෙරන්න…">
      <div class="bar"><div class="meta" id="ameta" style="margin:0"></div><button type="button" id="pickall">📖 පෙනෙන සියල්ල පොතට</button></div>
      <div id="alist"></div>
    </div>
  </section>
</div>
<div id="bk" hidden>
  <div class="bkbar"><b id="bkst">සකසමින්…</b><span class="acts" style="margin:0"><button class="p" id="bkprint" disabled>⬇ PDF ලෙස බාගන්න</button><button id="bkclose">වසන්න</button></span></div>
  <div id="bkwarn" class="err" style="padding:0 14px" hidden></div>
  <iframe id="bkf" title="පොත"></iframe>
</div>
<div id="toast"></div>

<script>
const SB_URL="https://jcijglwpkfluyzrltimk.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,rows=[],editId=null,timer;
const FIELDS=['title','url','author','tags','content','notes'];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

/* Tabs */
function showTab(n){
  $('#s-search').hidden=n!=='search';$('#s-admin').hidden=n!=='admin';
  $('#t-search').classList.toggle('on',n==='search');$('#t-admin').classList.toggle('on',n==='admin');
  if(n==='search')load(); else if(user)load();
}
$('#t-search').onclick=()=>showTab('search');
$('#t-admin').onclick=()=>showTab('admin');

/* Data + render */
const isAdminTab=()=>!$('#s-admin').hidden;
async function load(){
  const admin=isAdminTab(),qv=(admin?$('#aq'):$('#q')).value.trim();
  let req=sb.from('articles').select('*').order('created_at',{ascending:false}).limit(200);
  if(qv){const t=qv.replace(/[%,()*\\]/g,' ').trim();req=req.or(['title','author','tags','content','notes','url'].map(c=>`${c}.ilike.%${t}%`).join(','))}
  const {data,error}=await req;
  const meta=admin?$('#ameta'):$('#meta');
  if(error){meta.textContent='දෝෂයක්: '+error.message;return}
  rows=data;data.forEach(r=>store.set(r.id,r));render(admin,qv);
}
function hl(s,q){
  s=esc(s);if(!q)return s;
  return s.replace(new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}
function render(admin,q){
  const list=admin?$('#alist'):$('#list'),meta=admin?$('#ameta'):$('#meta');
  meta.textContent=rows.length+' ලිපි'+(q?' හමු විය':'');
  if(!rows.length){list.innerHTML='<div class="empty">ලිපි කිසිවක් නැත.</div>';return}
  list.innerHTML=rows.map(r=>{
    const link=r.url?`<a href="${esc(/^https?:/i.test(r.url)?r.url:'https://'+r.url)}" target="_blank" rel="noopener noreferrer">${hl(r.url,q)}</a>`:'';
    const by=r.author?'<span>✍ '+hl(r.author,q)+'</span>':'';
    const tags=(r.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag" data-t="${esc(t)}">${hl(t,q)}</span>`).join('');
    return `<article class="item" data-id="${r.id}">
      <h3>${hl(r.title||'(මාතෘකාවක් නැත)',q)}</h3>
      <div class="sub">${by}${by&&link?' &nbsp;|&nbsp; ':''}${link}${(by||link)?' &nbsp;|&nbsp; ':''}${new Date(r.created_at).toLocaleDateString('si-LK')}</div>
      <div>${tags}</div>
      ${r.content?`<div class="body">${hl(r.content,q)}</div>`:''}
      ${r.notes?`<div class="note">📝 ${hl(r.notes,q)}</div>`:''}
      <div class="acts">${r.content?'<button data-a="tog">සම්පූර්ණ කියවන්න</button>':''}<button data-a="copy">Copy as text</button><button data-a="pdf">Download as PDF</button>${admin?'<label class="pick"><input type="checkbox" data-a="pick"'+(order.includes(r.id)?' checked':'')+'> 📖 පොතට</label><button data-a="edit">සංස්කරණය</button><button class="d" data-a="del">මකන්න</button>':''}</div>
    </article>`}).join('');
}
function clicks(e){
  const pk=e.target.closest('input[data-a="pick"]');
  if(pk){const id=+pk.closest('.item').dataset.id,i=order.indexOf(id);
    if(pk.checked&&i<0)order.push(id);if(!pk.checked&&i>=0)order.splice(i,1);renderSel();return}
  const tag=e.target.closest('.tag');
  if(tag){const i=isAdminTab()?$('#aq'):$('#q');i.value=tag.dataset.t;load();return}
  const b=e.target.closest('button');if(!b)return;
  const el=b.closest('.item'),id=+el.dataset.id;
  if(b.dataset.a==='tog'){el.classList.toggle('open');b.textContent=el.classList.contains('open')?'හකුළන්න':'සම්පූර්ණ කියවන්න'}
  if(b.dataset.a==='edit'){startEdit(rows.find(r=>r.id===id))}
  if(b.dataset.a==='del'){del(id)}
  if(b.dataset.a==='copy'){copyText(rows.find(r=>r.id===id))}
  if(b.dataset.a==='pdf'){savePdf(rows.find(r=>r.id===id))}
}
function asText(r){
  return [r.title,
    r.author&&('ලේඛකයා: '+r.author),
    r.url&&('Link: '+r.url),
    r.tags&&('ටැග්: '+r.tags),
    '',r.content,
    r.notes&&('\nසටහන්: '+r.notes)
  ].filter(x=>x!==null&&x!==undefined&&x!==false).join('\n').trim();
}
async function copyText(r){
  const t=asText(r);
  try{await navigator.clipboard.writeText(t)}
  catch(e){
    const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(_){toast('Copy කිරීමට නොහැකි විය');a.remove();return}
    a.remove();
  }
  toast('Text ලෙස copy කළා');
}
function savePdf(r){
  const link=r.url?`<div class="m">${esc(r.url)}</div>`:'';
  const html=`<!DOCTYPE html><html lang="si"><head><meta charset="utf-8"><title>${esc(r.title||'ලිපිය')}</title>
<style>@page{margin:18mm}body{font:12pt/1.8 "Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;color:#000;background:#fff}
h1{font-size:18pt;margin:0 0 6pt}.m{color:#444;font-size:10pt;word-break:break-all}
.c{white-space:pre-wrap;margin-top:14pt}.n{margin-top:16pt;padding:8pt 10pt;border:1px solid #bbb;white-space:pre-wrap;font-size:11pt}</style></head><body>
<h1>${esc(r.title||'(මාතෘකාවක් නැත)')}</h1>
${r.author?`<div class="m">ලේඛකයා: ${esc(r.author)}</div>`:''}${link}
${r.tags?`<div class="m">ටැග්: ${esc(r.tags)}</div>`:''}
${r.content?`<div class="c">${esc(r.content)}</div>`:''}
${r.notes?`<div class="n">සටහන්: ${esc(r.notes)}</div>`:''}</body></html>`;
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  f.srcdoc=html;
  f.onload=()=>{
    setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),60000)},300);
  };
  document.body.appendChild(f);
  toast('Print කවුළුවේ "Save as PDF" තෝරන්න');
}
$('#list').onclick=clicks;$('#alist').onclick=clicks;
$('#q').oninput=$('#aq').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};

/* Auth */
function drawAdmin(){
  $('#login').hidden=!!user;$('#panel').hidden=!user;
  if(user){$('#who').textContent='ඇතුල් වී ඇත: '+user.email;if(isAdminTab())load()}
}
sb.auth.getSession().then(({data})=>{user=data.session?.user||null;drawAdmin()});
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;drawAdmin()});
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)$('#lerr').textContent='ඇතුල් විය නොහැක: '+error.message; else $('#pw').value='';
};
$('#out').onclick=()=>sb.auth.signOut();

/* Add / edit / delete */
function resetForm(){editId=null;$('#f').reset();$('#ft').textContent='නව ලිපියක් ඇතුළත් කරන්න';$('#cancel').hidden=true;$('#ferr').textContent=''}
function startEdit(r){
  editId=r.id;FIELDS.forEach(k=>$('#'+k).value=r[k]||'');
  $('#ft').textContent='ලිපිය සංස්කරණය';$('#cancel').hidden=false;$('#f').scrollIntoView({behavior:'smooth'});
}
$('#cancel').onclick=resetForm;
$('#f').onsubmit=async e=>{
  e.preventDefault();$('#ferr').textContent='';
  const rec={};FIELDS.forEach(k=>{const v=$('#'+k).value.trim();rec[k]=v||null});
  if(!Object.values(rec).some(Boolean)){$('#ferr').textContent='අවම වශයෙන් එක් ක්ෂේත්‍රයක් පුරවන්න.';return}
  const q=editId?sb.from('articles').update(rec).eq('id',editId):sb.from('articles').insert(rec);
  const {error}=await q;
  if(error){$('#ferr').textContent='සුරැකීමට නොහැකි විය: '+error.message;return}
  toast('සුරැකිණි');resetForm();load();
};
async function del(id){
  if(!confirm('මෙම ලිපිය මකන්නද?'))return;
  const {error}=await sb.from('articles').delete().eq('id',id);
  if(error){toast('දෝෂයක්: '+error.message);return}
  toast('මකා දැමිණි');load();
}

const store=new Map(),idxw={};let order=[];
const parseWords=s=>[...new Set((s||'').split(/[,\n]/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean))];
function syncPicks(){document.querySelectorAll('#alist input[data-a="pick"]').forEach(c=>c.checked=order.includes(+c.closest('.item').dataset.id))}
function addWords(sr,id,arr){
  const cur=parseWords(idxw[id]);
  arr.map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(w=>{if(!cur.some(c=>c.toLowerCase()===w.toLowerCase()))cur.push(w)});
  idxw[id]=cur.join(', ');sr.querySelector('.iw').value=idxw[id];
}
function renderSel(){
  $('#bcnt').textContent=order.length+' ලිපි තෝරා ඇත';
  const box=$('#bsel');
  if(!order.length){box.innerHTML='<div class="empty">ලිපි තෝරා නැත.</div>';return}
  box.innerHTML=order.map((id,i)=>{const r=store.get(id)||{};return `<div class="sr" data-id="${id}">
    <div class="srh"><b>${i+1}. ${esc(r.title||'(මාතෘකාවක් නැත)')}</b><span class="acts"><button type="button" data-b="up">↑</button><button type="button" data-b="dn">↓</button><button type="button" class="d" data-b="rm">✕</button></span></div>
    <label>Index වචන (කොමාවෙන් වෙන් කරන්න)</label><input class="iw" value="${esc(idxw[id]||'')}">
    <div class="acts"><button type="button" data-b="pk">🔎 ලිපියෙන් වචන තෝරන්න</button><button type="button" data-b="tg">ටැග් එක් කරන්න</button></div>
    <div class="pkb" hidden><div class="pkt">${esc(r.content||'')}</div><button type="button" class="p" data-b="add">තෝරාගත් පාඨය Index එකට එක් කරන්න</button></div></div>`}).join('');
}
$('#bsel').addEventListener('pointerdown',e=>{if(e.target.closest('[data-b="add"]'))e.preventDefault()});
$('#bsel').addEventListener('input',e=>{const sr=e.target.closest('.sr');if(sr&&e.target.classList.contains('iw'))idxw[sr.dataset.id]=e.target.value});
$('#bsel').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const sr=b.closest('.sr'),id=+sr.dataset.id,i=order.indexOf(id);
  const k=b.dataset.b;
  if(k==='up'&&i>0){[order[i-1],order[i]]=[order[i],order[i-1]];renderSel()}
  else if(k==='dn'&&i<order.length-1){[order[i+1],order[i]]=[order[i],order[i+1]];renderSel()}
  else if(k==='rm'){order.splice(i,1);renderSel();syncPicks()}
  else if(k==='pk'){const p=sr.querySelector('.pkb');p.hidden=!p.hidden}
  else if(k==='tg'){addWords(sr,id,(store.get(id).tags||'').split(','))}
  else if(k==='add'){
    const sel=getSelection(),t=(sel?sel.toString():'').replace(/[,\s]+/g,' ').trim();
    if(!t||!sr.querySelector('.pkt').contains(sel.anchorNode)){toast('පළමුව ලිපියෙන් වචනයක් තෝරන්න');return}
    addWords(sr,id,[t]);
  }
};
$('#pickall').onclick=()=>{rows.forEach(r=>{if(!order.includes(r.id))order.push(r.id)});renderSel();syncPicks()};
function addFront(f={}){
  const d=document.createElement('div');d.className='fp';
  d.innerHTML='<div class="row"><div><label>මුල් පිටුවේ මාතෘකාව (උදා: පිදුම, හැඳින්වීම, පෙරවදන)</label><input class="fh"></div><div><label>සැකැස්ම</label><select class="fc"><option value="j">Justify (තනි කොලමක්)</option><option value="c">මැදට (Center)</option></select></div></div><label>පාඨය (හිස් නම් මෙම පිටුව ඇතුළත් නොවේ)</label><textarea class="ftx" rows="4"></textarea><div class="foot"><button type="button" class="d fx">මෙම පිටුව ඉවත් කරන්න</button></div>';
  d.querySelector('.fh').value=f.h||'';d.querySelector('.fc').value=f.c||'j';

}
[{h:'පිදුම',c:'c'},{h:'හැඳින්වීම',c:'j'}].forEach(addFront);
$('#addfront').onclick=()=>addFront();

renderSel();

</style></head><body></body></html>`;

function loadFrame(){return new Promise(res=>{const f=$('#bkf');f.onload=()=>res(f.contentDocument);f.srcdoc=BOOK_HTML+'<!--'+Date.now()+'-->'})}
const setSt=t=>$('#bkst').textContent=t;

async function makeBook(){
  const err=$('#bkerr');err.textContent='';
  const title=$('#bt').value.trim();
  if(!title){err.textContent='පොතට නමක් ඇතුළත් කරන්න.';return}
  const items=order.map(id=>store.get(id)).filter(Boolean);
  if(!items.length){err.textContent='පොතට ලිපි තෝරන්න ("සුරැකි ලිපි" අතර 📖 පොතට ටික් කරන්න).';return}
  const cfg={title,sub:$('#bs').value.trim(),toc:$('#btoc').checked,idx:$('#bidx').checked,notes:$('#bnotes').checked,
    fronts:[...document.querySelectorAll('#bfront .fp')].map(d=>({h:d.querySelector('.fh').value.trim(),t:d.querySelector('.ftx').value.trim(),c:d.querySelector('.fc').value})).filter(f=>f.t),
    items:items.map(r=>({r,words:parseWords(idxw[r.id])}))};
  $('#bk').hidden=false;document.body.style.overflow='hidden';
  $('#bkprint').disabled=true;$('#bkwarn').hidden=true;setSt('සකසමින්…');
  try{await buildBook(cfg)}catch(e){console.error(e);setSt('දෝෂයක්: '+e.message)}
}
$('#mkbook').onclick=makeBook;
$('#bkclose').onclick=()=>{$('#bk').hidden=true;$('#bkf').srcdoc='';document.body.style.overflow=''};
$('#bkprint').onclick=()=>{const w=$('#bkf').contentWindow;w.focus();w.print()};

async function buildBook(cfg){
  const doc=await loadFrame();await doc.fonts.ready;
  const body=doc.body,G=26,tick=()=>new Promise(r=>setTimeout(r,0));
  const el=(tag,cls,txt)=>{const e=doc.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
  const mkPage=()=>{const p=el('section','pg'),fr=el('div','fr'),vp=el('div','vp'),pn=el('div','pn');fr.append(vp,pn);p.append(fr);body.append(p);return{p,vp,pn}};

  /* usable area inside the bordered frame */
  const probe=mkPage(),pr=probe.vp.getBoundingClientRect();
  const W=Math.floor(pr.width),H=Math.floor(pr.height);probe.p.remove();

  const mcOf=(node,c)=>{const m=el('div','mc');m.style.cssText=`width:${W}px;height:${H}px;column-count:${c};column-gap:${G}px`;m.append(node);return m};

  function findWords(root,words,step,c){
    const base=root.getBoundingClientRect().left,out={},nodes=[];
    const tw=doc.createTreeWalker(root.querySelector('.src')||root,4);let n;while((n=tw.nextNode()))nodes.push(n);
    words.forEach(w=>{
      const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),set=new Set();
      nodes.forEach(t=>{let m;re.lastIndex=0;
        while((m=re.exec(t.data))){
          if(!m[0].length){re.lastIndex++;continue}
          const rg=doc.createRange();rg.setStart(t,m.index);rg.setEnd(t,m.index+m[0].length);
          const r=rg.getClientRects()[0];if(r)set.add(Math.floor(Math.floor((r.left-base+1)/step)/c));
        }});
      out[w]=[...set].sort((a,b)=>a-b);
    });
    return out;
  }
  /* lay content out in c columns, count pages, locate index words */
  function measure(node,c,words){
    const pg=mkPage(),mc=mcOf(node,c);pg.vp.append(mc);
    const colW=(W-(c-1)*G)/c,step=colW+G;
    const cols=Math.max(c,Math.round((mc.scrollWidth+G)/step)),pages=Math.ceil(cols/c);
    const hits=words&&words.length?findWords(mc,words,step,c):{};
    pg.p.remove();return{pages,hits};
  }

  const hrefOf=u=>/^https?:/i.test(u)?u:'https://'+u;
  function artNode(r){
    const d=el('div');
    d.append(el('div','h1',r.title||'(මාතෘකාවක් නැත)'));
    if(r.author)d.append(el('div','au','ලේඛකයා: '+r.author));
    if(r.url){const u=el('div','u','මූලාශ්‍රය: '),a=el('a',null,r.url);a.href=hrefOf(r.url);u.append(a);d.append(u)}
    const src=el('div','src');d.append(src);
    let buf=[];const flush=()=>{const t=buf.join('\n').replace(/^\s*\n|\s+$/g,'');if(t.trim())src.append(el('div','t',t));buf=[]};
    String(r.content||'').split(/\r?\n/).forEach(line=>{
      const m=line.match(/^##\s+(.+)/);
      if(m){flush();src.append(el('div','h2',m[1].trim()))}else buf.push(line);
    });flush();
    if(cfg.notes&&r.notes){src.append(el('div','h2','සටහන්'));src.append(el('div','t',r.notes))}
    return d;
  }
  function frontNode(f){
    const d=el('div',f.c==='c'?'ctr':null);
    if(f.c==='c'){const sp=el('div');sp.style.height=Math.round(H*0.22)+'px';d.append(sp)}
    if(f.h)d.append(el('div','h1',f.h));
    d.append(el('div','t',f.t));return d;
  }
  function tocNode(list){
    const d=el('div');d.append(el('div','h1','පටුන'));
    list.forEach(([t,p])=>{const r=el('div','tr');r.append(el('span',null,t),el('span','dl'),el('span','pgn',String(p)));d.append(r)});
    return d;
  }
  function indexNode(map){
    const d=el('div');d.append(el('div','h1','සුචිය'));
    [...map.values()].sort((a,b)=>a.w.localeCompare(b.w,'si')).forEach(x=>{
      const r=el('div','tr');r.append(el('span',null,x.w),el('span','dl'),el('span','pgs',[...x.p].sort((a,b)=>a-b).join(', ')));d.append(r)});
    return d;
  }

  /* pass 1: measure */
  setSt('පිටු මනිමින්…');await tick();
  const fr=cfg.fronts.map(f=>{const node=frontNode(f);return{node,c:1,n:measure(node,1).pages}});
  const arts=[];
  for(const [i,it] of cfg.items.entries()){
    setSt(`ලිපි සකසමින් (${i+1}/${cfg.items.length})…`);await tick();
    const node=artNode(it.r),m=measure(node,1,it.words);
    arts.push({it,node,pages:m.pages,hits:m.hits});
  }
  const frontN=fr.reduce((s,x)=>s+x.n,0);
  let tocN=0;
  const startsOf=()=>{let p=1+frontN+tocN+1;return arts.map(a=>{const s=p;p+=a.pages;return s})};
  const ttl=a=>a.it.r.title||'(මාතෘකාවක් නැත)';
  if(cfg.toc){
    tocN=measure(tocNode(arts.map(a=>[ttl(a),'000'])),1).pages;
    for(let i=0;i<3;i++){const st=startsOf(),nn=measure(tocNode(arts.map((a,k)=>[ttl(a),st[k]])),1).pages;if(nn===tocN)break;tocN=nn}
  }
  const starts=startsOf();

  /* index */
  const imap=new Map(),missing=[];
  arts.forEach((a,k)=>a.it.words.forEach(w=>{
    const pg=a.hits[w]||[];
    if(!pg.length){missing.push(`“${w}” (${ttl(a)})`);return}
    const key=w.toLowerCase();if(!imap.has(key))imap.set(key,{w,p:new Set()});
    pg.forEach(x=>imap.get(key).p.add(starts[k]+x));
  }));
  const useIdx=cfg.idx&&imap.size>0;
  const idxNode=useIdx?indexNode(imap):null,idxN=useIdx?measure(idxNode,1).pages:0;

  /* pass 2: emit pages */
  setSt('පිටු සකසමින්…');await tick();
  body.innerHTML='';let pageNo=0;
  const emit=(node,c,n)=>{for(let k=0;k<n;k++){
    pageNo++;const pg=mkPage(),mc=mcOf(node.cloneNode(true),c);
    mc.style.transform=`translateX(${-k*(W+G)}px)`;pg.vp.append(mc);pg.pn.textContent=pageNo;}};
  {pageNo++;const pg=mkPage(),cv=el('div','cv');cv.append(el('div','ct',cfg.title));if(cfg.sub)cv.append(el('div','cs',cfg.sub));pg.vp.append(cv)}
  fr.forEach(x=>emit(x.node,x.c,x.n));
  if(cfg.toc)emit(tocNode(arts.map((a,k)=>[ttl(a),starts[k]])),1,tocN);
  arts.forEach(a=>emit(a.node,1,a.pages));
  if(useIdx)emit(idxNode,1,idxN);

  setSt(`පිටු ${pageNo} ක් • සූදානම්. "PDF ලෙස බාගන්න" ඔබා Destination: Save as PDF තෝරන්න.`);
  if(missing.length||(cfg.idx&&!useIdx&&cfg.items.some(i=>i.words.length))){
    const w=$('#bkwarn');w.textContent=missing.length?'ලිපිවල නොමැති Index වචන (මඟ හැරිණි): '+missing.join(', '):'';w.hidden=!missing.length;
  }
  $('#bkprint').disabled=false;
}

load();
</script>
