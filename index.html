<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ලිපි ගබඩාව</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1d2a26;--mute:#667570;--line:#d9dfdb;--acc:#1f6f5c;--acc2:#e4f0ec;--danger:#b3372f}
@media (prefers-color-scheme:dark){:root{--bg:#141b19;--card:#1c2623;--ink:#e6eeeb;--mute:#93a39d;--line:#2d3a36;--acc:#5fc2a8;--acc2:#21352f;--danger:#ff8f86}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 12px}
h2{font-size:1.15rem;margin:0 0 4px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.d{color:var(--danger)}
:is(button,input,textarea):focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{resize:vertical}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;padding:10px 18px;color:var(--mute);margin-bottom:-2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.big{font-size:1.05rem;padding:12px 14px;margin-bottom:6px}
.meta{color:var(--mute);font-size:.9rem;margin-bottom:14px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.item h3{margin:0 0 2px;font-size:1.1rem}
.sub{color:var(--mute);font-size:.88rem;word-break:break-all}
.sub a{color:var(--acc)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:0 10px;font-size:.8rem;margin:6px 6px 0 0;cursor:pointer}
.body{white-space:pre-wrap;margin-top:10px;max-height:5.2em;overflow:hidden}
.item.open .body{max-height:none}
.note{margin-top:8px;padding:8px 10px;background:var(--acc2);border-radius:8px;font-size:.92rem;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{padding:4px 12px;font-size:.88rem}
mark{background:#ffe27a;color:#000;border-radius:3px;padding:0 1px}
label{display:block;margin:10px 0 3px;font-size:.9rem;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px}
.foot{display:flex;gap:8px;margin-top:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.empty{text-align:center;color:var(--mute);padding:36px 0}
.err{color:var(--danger);margin-top:10px;font-size:.92rem;white-space:pre-wrap}
[hidden]{display:none!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ලිපි ගබඩාව</h1>
  <div class="tabs">
    <button id="t-search" class="on">🔍 සොයන්න</button>
    <button id="t-admin">🔐 Admin</button>
  </div>

  <section id="s-search">
    <input id="q" class="big" type="search" placeholder="සොයන්න: මාතෘකාව, කතුවරයා, ටැග්, ලිපියේ වචන…">
    <div class="meta" id="meta"></div>
    <div id="list"></div>
  </section>

  <section id="s-admin" hidden>
    <div id="login" class="box" style="max-width:420px">
      <h2>Admin ප්‍රවේශය</h2>
      <form id="lf">
        <label>Email</label><input id="em" type="email" autocomplete="username" required>
        <label>මුරපදය</label><input id="pw" type="password" autocomplete="current-password" required>
        <div class="foot"><button class="p" type="submit">ඇතුල් වන්න</button></div>
        <div class="err" id="lerr"></div>
      </form>
    </div>

    <div id="panel" hidden>
      <div class="bar"><span id="who" class="sub"></span><button id="out">ඉවත් වන්න</button></div>
      <form id="f" class="box">
        <h2 id="ft">නව ලිපියක් ඇතුළත් කරන්න</h2>
        <label>ලිපියේ මාතෘකාව</label><input id="title">
        <div class="row">
          <div><label>Web link එක</label><input id="url" placeholder="https://…"></div>
          <div><label>ලේඛකයාගේ නම</label><input id="author"></div>
        </div>
        <label>ටැග් (කොමාවෙන් වෙන් කරන්න)</label><input id="tags">
        <label>ලිපිය (Text)</label><textarea id="content" rows="10"></textarea>
        <label>මගේ සටහන්</label><textarea id="notes" rows="2"></textarea>
        <div class="foot"><button class="p" type="submit" id="save">සුරකින්න</button><button type="button" id="cancel" hidden>වෙනස් කිරීම නවතන්න</button></div>
        <div class="err" id="ferr"></div>
      </form>
      <h2>සුරැකි ලිපි</h2>
      <input id="aq" class="big" type="search" placeholder="ලිපි අතර පෙරන්න…">
      <div class="meta" id="ameta"></div>
      <div id="alist"></div>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const SB_URL="https://jcijglwpkfluyzrltimk.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,rows=[],editId=null,timer;
const FIELDS=['title','url','author','tags','content','notes'];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}

/* Tabs */
function showTab(n){
  $('#s-search').hidden=n!=='search';$('#s-admin').hidden=n!=='admin';
  $('#t-search').classList.toggle('on',n==='search');$('#t-admin').classList.toggle('on',n==='admin');
  if(n==='search')load(); else if(user)load();
}
$('#t-search').onclick=()=>showTab('search');
$('#t-admin').onclick=()=>showTab('admin');

/* Data + render */
const isAdminTab=()=>!$('#s-admin').hidden;
async function load(){
  const admin=isAdminTab(),qv=(admin?$('#aq'):$('#q')).value.trim();
  let req=sb.from('articles').select('*').order('created_at',{ascending:false}).limit(200);
  if(qv){const t=qv.replace(/[%,()*\\]/g,' ').trim();req=req.or(['title','author','tags','content','notes','url'].map(c=>`${c}.ilike.%${t}%`).join(','))}
  const {data,error}=await req;
  const meta=admin?$('#ameta'):$('#meta');
  if(error){meta.textContent='දෝෂයක්: '+error.message;return}
  rows=data;render(admin,qv);
}
function hl(s,q){
  s=esc(s);if(!q)return s;
  return s.replace(new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}
function render(admin,q){
  const list=admin?$('#alist'):$('#list'),meta=admin?$('#ameta'):$('#meta');
  meta.textContent=rows.length+' ලිපි'+(q?' හමු විය':'');
  if(!rows.length){list.innerHTML='<div class="empty">ලිපි කිසිවක් නැත.</div>';return}
  list.innerHTML=rows.map(r=>{
    const link=r.url?`<a href="${esc(/^https?:/i.test(r.url)?r.url:'https://'+r.url)}" target="_blank" rel="noopener noreferrer">${hl(r.url,q)}</a>`:'';
    const by=r.author?'<span>✍ '+hl(r.author,q)+'</span>':'';
    const tags=(r.tags||'').split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag" data-t="${esc(t)}">${hl(t,q)}</span>`).join('');
    return `<article class="item" data-id="${r.id}">
      <h3>${hl(r.title||'(මාතෘකාවක් නැත)',q)}</h3>
      <div class="sub">${by}${by&&link?' &nbsp;|&nbsp; ':''}${link}${(by||link)?' &nbsp;|&nbsp; ':''}${new Date(r.created_at).toLocaleDateString('si-LK')}</div>
      <div>${tags}</div>
      ${r.content?`<div class="body">${hl(r.content,q)}</div>`:''}
      ${r.notes?`<div class="note">📝 ${hl(r.notes,q)}</div>`:''}
      <div class="acts">${r.content?'<button data-a="tog">සම්පූර්ණ කියවන්න</button>':''}${admin?'<button data-a="edit">සංස්කරණය</button><button class="d" data-a="del">මකන්න</button>':''}</div>
    </article>`}).join('');
}
function clicks(e){
  const tag=e.target.closest('.tag');
  if(tag){const i=isAdminTab()?$('#aq'):$('#q');i.value=tag.dataset.t;load();return}
  const b=e.target.closest('button');if(!b)return;
  const el=b.closest('.item'),id=+el.dataset.id;
  if(b.dataset.a==='tog'){el.classList.toggle('open');b.textContent=el.classList.contains('open')?'හකුළන්න':'සම්පූර්ණ කියවන්න'}
  if(b.dataset.a==='edit'){startEdit(rows.find(r=>r.id===id))}
  if(b.dataset.a==='del'){del(id)}
}
$('#list').onclick=clicks;$('#alist').onclick=clicks;
$('#q').oninput=$('#aq').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};

/* Auth */
function drawAdmin(){
  $('#login').hidden=!!user;$('#panel').hidden=!user;
  if(user){$('#who').textContent='ඇතුල් වී ඇත: '+user.email;if(isAdminTab())load()}
}
sb.auth.getSession().then(({data})=>{user=data.session?.user||null;drawAdmin()});
sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;drawAdmin()});
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)$('#lerr').textContent='ඇතුල් විය නොහැක: '+error.message; else $('#pw').value='';
};
$('#out').onclick=()=>sb.auth.signOut();

/* Add / edit / delete */
function resetForm(){editId=null;$('#f').reset();$('#ft').textContent='නව ලිපියක් ඇතුළත් කරන්න';$('#cancel').hidden=true;$('#ferr').textContent=''}
function startEdit(r){
  editId=r.id;FIELDS.forEach(k=>$('#'+k).value=r[k]||'');
  $('#ft').textContent='ලිපිය සංස්කරණය';$('#cancel').hidden=false;$('#f').scrollIntoView({behavior:'smooth'});
}
$('#cancel').onclick=resetForm;
$('#f').onsubmit=async e=>{
  e.preventDefault();$('#ferr').textContent='';
  const rec={};FIELDS.forEach(k=>{const v=$('#'+k).value.trim();rec[k]=v||null});
  if(!Object.values(rec).some(Boolean)){$('#ferr').textContent='අවම වශයෙන් එක් ක්ෂේත්‍රයක් පුරවන්න.';return}
  const q=editId?sb.from('articles').update(rec).eq('id',editId):sb.from('articles').insert(rec);
  const {error}=await q;
  if(error){$('#ferr').textContent='සුරැකීමට නොහැකි විය: '+error.message;return}
  toast('සුරැකිණි');resetForm();load();
};
async function del(id){
  if(!confirm('මෙම ලිපිය මකන්නද?'))return;
  const {error}=await sb.from('articles').delete().eq('id',id);
  if(error){toast('දෝෂයක්: '+error.message);return}
  toast('මකා දැමිණි');load();
}
load();
</script>
</body>
</html>
